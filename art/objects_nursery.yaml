# 皇家育嬰室分層設計（2026-10-08，照《仙泉．香布纏．續》嚴家 objects_a2.yaml 的做法；單色塊驗證階段，還沒產圖）
#
# 單位：細格（原本 24×18 一格切成 2×2，地圖 48×36）。寵物身體約 2 細格寬、3 細格高。
#   foot 佔地格（擋路）、up 往上長（不佔空間，寵物走進去會被蓋住）、排序列＝佔地最下一列。
#   引擎前後順序：自由圖片用圖框下緣那一列、寵物用自己站的列，小的先畫；所以站在家具南邊（下方）的寵物畫在上面、北邊的被蓋住。
# 場景：雲端王都的育嬰室，午後陽光從北邊拱窗斜照進來。北牆有拱窗、藍窗簾、鳶尾旗；西牆有貝殼鏡，西北角書櫃；
#       東北角嬰兒床（紗帳、蝴蝶結），東牆沙發；中間雲朵地毯；南邊是白色欄杆，正中門口地墊（之後接別的地圖）。
# 參考：assets/art/maps/nursery.webp（舊整張俯視畫，配置照它）。

map: {id: nursery, w: 48, h: 36}

ground:
  - {name: 邊界西, kind: border, rects: [[0, 0, 1, 36]]}
  - {name: 邊界東, kind: border, rects: [[47, 0, 1, 36]]}
  - {name: 木地板, kind: floor, rects: [[1, 6, 46, 27]], desc: 蜂蜜色淺橡木地板，午後窗光斜斜鋪在上面}
  - {name: 雲朵地毯, kind: rug, rects: [[14, 12, 4, 14], [18, 11, 14, 17], [32, 14, 4, 12]], desc: 蓬鬆的白色雲朵形羊毛地毯（地面，寵物可以走上去）}
  - {name: 嬰兒床圓毯, kind: rug2, rects: [[35, 9, 12, 6]], desc: 嬰兒床下的粉色圓毯}
  # 北牆後面沒有地方能走，寵物永遠在牆前面，所以牆直接畫在底圖裡（block＝擋路的地面）
  - {name: 北牆, kind: wall, block: true, rects: [[1, 0, 46, 6]], desc: 奶白護牆板＋金色細框，正中拱形大窗看得到藍天，兩側淺藍窗簾用金流蘇束起，左右各掛一面藍底金鳶尾旗}
  - {name: 門口地墊, kind: mat, rects: [[20, 33, 8, 3]], desc: 藍底金鳶尾的門口地墊（之後接別的地圖）}

objects:
  # ── 西北角 ──
  - {name: 書櫃, kind: 櫃, foot: [2, 6, 9, 2], up: 6, desc: 奶白描金的矮書櫃，上層擺一頂小金冠、幾本粉藍書，下層兩個帽盒；頂上垂著常春藤}
  - {name: 書櫃旁盆栽, kind: 盆栽, foot: [11, 6, 3, 2], up: 3, desc: 白瓷盆的綠葉盆栽}
  # ── 西牆 ──
  - {name: 貝殼鏡, kind: 鏡, foot: [1, 9, 4, 7], up: 2, desc: 粉色扇貝殼框的落地穿衣鏡，靠西牆立著（互動：換造型）}
  - {name: 矮凳, kind: 凳, foot: [6, 11, 4, 3], up: 1, desc: 粉色絨面圓矮凳，金色小腳}
  - {name: 西牆盆栽, kind: 盆栽, foot: [1, 17, 3, 2], up: 3, desc: 白瓷盆的綠葉盆栽，開小白花}
  - {name: 糖果小桌, kind: 桌, foot: [4, 18, 4, 3], up: 2, desc: 金邊圓形小邊桌，上面一盤星星糖和一本粉紅皮面的王室日誌（日誌畫在同一張；互動：看日誌）}
  - {name: 玩具箱, kind: 箱, foot: [1, 24, 7, 6], up: 2, desc: 打開的淺藍描金木箱，露出彩色球、小城堡、星星玩偶、白毛巾（互動：玩耍）}
  # ── 東北角 ──
  - {name: 嬰兒床, kind: 床, foot: [37, 6, 9, 6], up: 6, desc: 圓形白金色嬰兒床，粉色紗帳從頂上垂下、頂端大蝴蝶結，床裡有枕頭、星星抱枕、藍毯子}
  - {name: 點心籃, kind: 籃, foot: [34, 11, 3, 2], up: 2, desc: 嬰兒床左下角地上的藤編點心籃，粉格子布、草莓布丁和鬆餅（互動：餵食）}
  - {name: 檯燈邊桌, kind: 桌, foot: [44, 12, 3, 3], up: 2, desc: 奶白小邊桌，上面一盞星星檯燈}
  # ── 東牆 ──
  - {name: 東牆盆栽, kind: 盆栽, foot: [44, 16, 3, 3], up: 3, desc: 白瓷盆的綠葉盆栽}
  - {name: 沙發, kind: 沙發, foot: [41, 21, 6, 11], up: 2, desc: 靠東牆的長沙發，花朵抱枕、星星抱枕、藍格子毯垂下來；座墊中段放著奶油色包裝、粉緞帶的王室禮物箱（畫在同一張：分開的話禮物箱排序比沙發前緣北，會被沙發蓋掉）}
  # ── 地毯上 ──
  - {name: 圓墊, kind: 墊, foot: [28, 20, 6, 4], up: 2, desc: 地毯上的粉色大圓坐墊（2026-10-08 作者怕正中間太小塊不可愛：放大成一組，坐墊加星星抱枕一起畫），旁邊一黃一藍兩顆星星抱枕}
  # ── 南邊欄杆（最前面一排，站在它北邊的寵物會被欄杆擋住下半身） ──
  - {name: 南欄西, kind: 欄杆, foot: [1, 33, 19, 2], up: 1, desc: 白色欄杆、金色欄柱頭，西端一盆小白花盆栽}
  - {name: 南欄東, kind: 欄杆, foot: [28, 33, 19, 2], up: 1, desc: 同南欄西，東端一盆小白花盆栽}

# 寵物要站上去的點（不能落在佔地格上），以及互動事件要掛的家具格（在佔地格上，寵物從旁邊那一格靠近）
points:
  hero_start: [24, 18]
  mirror_stand: [5, 12]
  journal_stand: [8, 19]
  toys_stand: [8, 27]
  basket_stand: [33, 12]
  gift_stand: [40, 26]
  poop_a: [18, 27]
  poop_b: [30, 26]
  poop_c: [26, 11]
walk_points: [hero_start, mirror_stand, journal_stand, toys_stand, basket_stand, gift_stand, poop_a, poop_b, poop_c]
