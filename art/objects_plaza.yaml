  - {name: 邊界東, kind: border, rects: [[47, 0, 1, 36]]}
  - {name: 石板地, kind: stone, rects: [[1, 6, 46, 30]], desc: 奶白與淺金色的圓弧石板，以噴水池為中心一圈一圈鋪開}
  - {name: 草坪西北, kind: grass, rects: [[2, 8, 13, 10]], desc: 修剪整齊的嫩綠草坪（可以走）}
