# 王城中央廣場分層設計（2026-10-09，成年後的連線地圖；單色塊驗證階段，還沒產圖）
#
# 單位：細格（48×36，跟育嬰室一樣；寵物身體約 2 細格寬）。foot 佔地擋路、up 往上的高度（寵物走進去被蓋住）、排序列＝佔地最下一列。
# 場景：雲端王都正中央的圓形廣場，晴天上午。北邊是王宮正門的白色台階與拱門（走不過去），正中一座三層噴水池，
#       四角草坪各一棵開花的樹、一個花圃；噴水池四面各一張長椅；路燈、王室旗桿；南邊正中是回育嬰室的出口。
# 成年禮之後從育嬰室門口出發來這裡；這張地圖開多人連線（育嬰室與劇情不開）。

map: {id: plaza, w: 48, h: 36}

ground:
