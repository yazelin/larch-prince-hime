  - {name: 草坪西南, kind: grass, rects: [[2, 22, 13, 10]]}
  - {name: 草坪東南, kind: grass, rects: [[33, 22, 13, 10]]}
  # 王宮正門在最北邊：後面走不到，直接畫在底圖（block＝擋路的地面）
  - {name: 王宮正門, kind: wall, block: true, rects: [[1, 0, 46, 6]], desc: 白色大理石台階往上通到王宮拱門，兩側金色欄杆與藍底金冠旗}
  # 南邊只留正中出口，其餘是矮花牆外的雲（走不過去）
  - {name: 南邊雲海, kind: border, rects: [[1, 34, 21, 2], [26, 34, 21, 2]]}
  - {name: 出口, kind: mat, rects: [[22, 34, 4, 2]], desc: 往南的石板小路（回育嬰室）}

